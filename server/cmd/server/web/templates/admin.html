<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitHub Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    <div class="max-w-4xl mx-auto px-4 py-8">
        <!-- Header -->
        <header class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">Administration FitHub</h1>
                <p class="text-gray-600 mt-1">Configuration globale du serveur</p>
            </div>
            <a href="/" class="text-blue-600 hover:text-blue-800 text-sm font-medium">← Retour à l'accueil</a>
        </header>

        <!-- Settings Form -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100">
                <h2 class="text-xl font-semibold text-gray-900">Paramètres Globaux</h2>
            </div>
            <form id="settings-form" class="p-6 space-y-6">
                <!-- OpenRouter API Key -->
                <div>
                    <label for="openrouter_api_key" class="block text-sm font-medium text-gray-700 mb-2">
                        Clé API OpenRouter <span class="text-red-500">*</span>
                    </label>
                    <input type="password" id="openrouter_api_key" name="openrouter_api_key"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           placeholder="sk-or-v1-..." autocomplete="off">
                    <p class="mt-1 text-xs text-gray-500">Clé partagée pour tous les appels IA. Ne jamais exposer côté client.</p>
                </div>

                <!-- AI Model -->
                <div>
                    <label for="ai_model" class="block text-sm font-medium text-gray-700 mb-2">
                        Modèle IA
                    </label>
                    <select id="ai_model" name="ai_model"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="deepseek/deepseek-chat">DeepSeek Chat</option>
                        <option value="google/gemini-2.5-flash">Gemini 2.5 Flash</option>
                        <option value="openai/gpt-4o-mini">GPT-4o Mini</option>
                        <option value="anthropic/claude-3.5-haiku">Claude 3.5 Haiku</option>
                    </select>
                </div>

                <!-- Registrations -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Inscriptions ouvertes</label>
                    <div class="flex items-center">
                        <input type="checkbox" id="registrations_open" name="registrations_open"
                               class="w-5 h-5 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                        <label for="registrations_open" class="ml-3 text-gray-700">Autoriser la création de nouveaux comptes</label>
                    </div>
                </div>

                <!-- Actions -->
                <div class="flex justify-end pt-4 border-t border-gray-100">
                    <button type="submit"
                            class="px-6 py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition-colors">
                        Sauvegarder les paramètres
                    </button>
                </div>
            </form>
        </div>

        <!-- Profiles Section -->
        <div class="mt-8 bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                <h2 class="text-xl font-semibold text-gray-900">Profils Utilisateurs</h2>
                <button onclick="showProfileModal()" class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700">
                    + Nouveau profil
                </button>
            </div>
            <div class="p-6">
                <div id="profiles-list" class="space-y-4">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Profile Modal -->
    <div id="profile-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl p-6 w-full max-w-md mx-4">
            <h3 class="text-lg font-semibold mb-4">Nouveau profil</h3>
            <form id="profile-form" class="space-y-4">
                <input type="hidden" id="profile-id" name="id">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nom</label>
                    <input type="text" id="profile-name" name="name" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Poids (kg)</label>
                        <input type="number" step="0.1" id="profile-weight" name="weight_kg" required min="30" max="200"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">FC Max</label>
                        <input type="number" id="profile-maxhr" name="max_heart_rate" required min="100" max="220"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">FC Repos</label>
                    <input type="number" id="profile-resthr" name="resting_heart_rate" required min="30" max="100"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex justify-end gap-3 pt-4">
                    <button type="button" onclick="hideProfileModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">Annuler</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Créer</button>
                </div>
            </form>
        </div>

    <script>
        // Load settings on page load
        async function loadSettings() {
            try {
                const res = await fetch('/admin/api/settings');
                const data = await res.json();
                document.getElementById('openrouter_api_key').value = data.openrouter_api_key || '';
                document.getElementById('ai_model').value = data.ai_model || 'deepseek/deepseek-chat';
                document.getElementById('registrations_open').checked = data.registrations_open === 'true';
            } catch (e) {
                console.error('Failed to load settings', e);
            }
        }

        async function loadProfiles() {
            try {
                const res = await fetch('/admin/api/profiles');
                const profiles = await res.json();
                const container = document.getElementById('profiles-list');
                if (profiles.length === 0) {
                    container.innerHTML = '<p class="text-gray-500 text-center py-8">Aucun profil. Cliquez sur "Nouveau profil" pour commencer.</p>';
                    return;
                }
                container.innerHTML = profiles.map(p => `
                    <div class="flex items-center justify-between p-4 bg-gray-50 rounded-lg">
                        <div>
                            <p class="font-medium text-gray-900">${p.name}</p>
                            <p class="text-sm text-gray-500">${p.weight_kg} kg • FCmax ${p.max_heart_rate} • FCrepos ${p.resting_heart_rate}</p>
                        </div>
                        <button onclick="deleteProfile(${p.id})" class="text-red-600 hover:text-red-800 text-sm">Supprimer</button>
                    </div>
                `).join('');
            } catch (e) {
                console.error('Failed to load profiles', e);
            }
        }

        document.getElementById('settings-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = {};
            formData.forEach((v, k) => data[k] = k === 'registrations_open' ? (v === 'on' ? 'true' : 'false') : v);
            try {
                await fetch('/admin/api/settings', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                alert('Paramètres sauvegardés');
            } catch (err) {
                alert('Erreur: ' + err.message);
            }
        });

        function showProfileModal() {
            document.getElementById('profile-form').reset();
            document.getElementById('profile-id').value = '';
            document.getElementById('profile-modal').classList.remove('hidden');
            document.getElementById('profile-modal').classList.add('flex');
        }
        function hideProfileModal() {
            document.getElementById('profile-modal').classList.add('hidden');
            document.getElementById('profile-modal').classList.remove('flex');
        }

        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById('profile-name').value,
                weight_kg: parseFloat(document.getElementById('profile-weight').value),
                max_heart_rate: parseInt(document.getElementById('profile-maxhr').value),
                resting_heart_rate: parseInt(document.getElementById('profile-resthr').value)
            };
            try {
                await fetch('/admin/api/profiles', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                hideProfileModal();
                loadProfiles();
            } catch (err) {
                alert('Erreur: ' + err.message);
            }
        });

        async function deleteProfile(id) {
            if (!confirm('Supprimer ce profil ?')) return;
            // TODO: implement DELETE endpoint
            alert('Suppression non implémentée');
        }

        // Init
        loadSettings();
        loadProfiles();
    </script>
</body>
</html>
